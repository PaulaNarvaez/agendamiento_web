services:
  - type: web
    name: camila-leiva-agenda
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: GOOGLE_ACCOUNT_EMAIL
        value: t.frecuenciaamorosa@gmail.com
      - key: GOOGLE_CALENDAR_ID
        value: t.frecuenciaamorosa@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SESSION_DURATION_MINUTES
        value: "55"
      - key: SESSION_PRICE_CLP
        sync: false
      - key: AVAILABLE_WEEKDAYS
        value: "3,5"
      - key: AVAILABLE_HOURS
        value: ""
      - key: AVAILABLE_HOURS_BY_DAY
        value: '{"3":["15:00","16:00","17:00","18:00","19:00"],"5":["10:00","11:00","12:00","15:00","16:00","17:00","18:00"]}'
